apiVersion: v1
kind: Secret
metadata:
  name: encryption-demo-secrets
type: Opaque
stringData:
  ENCRYPTION_KEY: "replace-with-strong-random-key"
  RSA_PASSPHRASE: ""
  VAULT_ADDR: "https://vault.example.com"
  VAULT_TOKEN: "replace-with-vault-token"
  VAULT_AEAD_SECRET_PATH: "secret/data/encryption/aead"
  VAULT_RSA_KEY_PATH: "secret/data/encryption/rsa"
